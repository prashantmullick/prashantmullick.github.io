<h1>Health Data Sync</h1>
<p>Health Data Sync is a single-user utility app. It reads Google Health data (activity, sleep and health measurement summaries) for one Google account and writes daily summaries into that account's own Google Sheet.</p>
<p>Privacy policy: <a href="https://prashantmullick.github.io/privacy.html">https://prashantmullick.github.io/privacy.html</a></p>
